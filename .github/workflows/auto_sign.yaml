# run main.py
name: Auto Sign
on:
  schedule:
    - cron: '1 16 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
        TZ: Asia/Shanghai
        # 强制使用 Node.js 24 运行官方 Actions 插件，以消除 Node.js 20 弃用警告
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install cryptography
      - name: Run main.py
        env:
          GitHub_Actions: true
          # 对于多个账号一定会有人机验证问题，且因为是密码，有一定的安全风险
          # PHONE: ${{ secrets.PHONE }}
          # PASSWORD: ${{ secrets.PASSWORD }}
          TOKEN: ${{ secrets.TOKEN }}
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
          SC3_UID: ${{ secrets.SC3_UID }}
          EXIT_WHEN_FAIL: ${{ vars.EXIT_WHEN_FAIL }}
          QMSG_TOKEN: ${{ secrets.QMSG_TOKEN }}
        run: |
          python src/main.py
